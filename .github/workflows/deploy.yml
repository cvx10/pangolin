name: Deploy Pangolin Stack

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pangolin
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.PANGOLIN_DEPLOY_PATH }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for TruffleHog to scan history

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:homelab

      - name: Deploy via Tailscale
        run: |
          # Auth is Tailscale SSH (tailnet identity); no key material needed.
          # Add host key to known_hosts to avoid interactive prompt.
          # Retried: the ephemeral runner node can take a few seconds to
          # get connectivity after joining the tailnet.
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            if ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 5
          done

          # Deploy
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            
            echo '📁 Navigating to deployment directory...'
            cd $DEPLOY_PATH
            
            echo '🔀 Absorbing local config drift...'
            # Pangolin rewrites config/traefik/traefik_config.yml at every start
            # (it pins the badger plugin version shipped with its image). Left
            # uncommitted, that change makes 'git pull' abort and, under 'set -e',
            # it stops the whole deploy. Commit it instead, then push it back so
            # it does not come back at the next restart. That commit only touches
            # config/, so the 'paths' filter above does not retrigger a deploy.
            # 'git add -u' on purpose, never 'git add -A': this repo is public,
            # and a new untracked runtime file could carry credentials.
            if ! git diff --quiet; then
              echo 'Local drift detected:'
              git diff --stat
              git add -u
              git -c user.name='pangolin-vps' -c user.email='deploy@lupica.be' commit -m 'chore(config): absorb runtime config drift from Pangolin'
            fi

            echo '📥 Pulling latest changes...'
            git pull origin main

            # Non-fatal: a merge landing between the pull and the push loses the
            # race, and the next deploy rebases and pushes the commit anyway.
            # Failing here would abort a deploy whose containers are still fine.
            git push origin main || echo '::warning::Could not push the drift commit; next deploy will retry.'
            
            echo '🐳 Pulling new Docker images...'
            docker compose pull
            
            echo '🚀 Starting services...'
            docker compose up -d
            
            echo '⏳ Waiting for services to be healthy...'
            sleep 10
            
            echo '🏥 Running health check...'
            # Check if all containers are running and healthy
            if docker compose ps --format json | grep -q '\"Health\":\"healthy\"'; then
              echo '✅ Health check passed!'
              docker compose ps
            else
              echo '❌ Health check failed!'
              docker compose ps
              docker compose logs --tail=50 pangolin
              exit 1
            fi
            
            echo '🧹 Cleaning up unused Docker images...'
            docker image prune -f
            
            echo '✨ Deployment complete!'
          "

      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
          echo "You may need to SSH to the server and check docker compose logs"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set, skipping Telegram alert."
            exit 0
          fi

          subject=$(git log -1 --pretty=%s "$GITHUB_SHA" 2>/dev/null || echo '(unknown commit)')
          text=$(printf '%s\n%s\n%s\n%s\n' \
            '❌ Pangolin deploy failed' \
            "commit ${GITHUB_SHA:0:7} — ${subject}" \
            "host ${DEPLOY_HOST}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")

          # Public access is down or stale until this is fixed: alert loudly, but
          # never fail the job on the notification itself.
          curl -sS -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode 'disable_web_page_preview=true' \
            || echo "::warning::Telegram notification failed."
