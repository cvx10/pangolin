name: pangolin
services:
  pangolin:
    image: docker.io/fosrl/pangolin:1.24.0
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./config:/app/config
    ports:
      # Integration API (flags.enable_integration_api in config.yml).
      # Loopback ONLY: reached over `ssh -L 3003:127.0.0.1:3003 vps` or from the
      # VPS itself. Never route it through Traefik, and never bind the tailnet IP:
      # if tailscaled is not up at boot, the bind fails, the pangolin container
      # does not start, gerbil waits on it, and every public site goes down.
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:1.5.2
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80

  traefik:
    # Full version, never a floating `v3.7`: `docker compose pull` in every
    # deploy would move a floating tag with no PR, and Dependabot only proposes
    # updates for tags it can compare. Same failure class as the Cilium range
    # that self-upgraded in homelab-cluster on 2026-09-15.
    image: docker.io/traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped

    network_mode: service:gerbil # Ports appear on the gerbil service

    environment:
      - CROWDSEC_LAPI_KEY=${CROWDSEC_LAPI_KEY}
      - LETS_ENCRYPT_EMAIL=${LETS_ENCRYPT_EMAIL}
      - PANGOLIN_DOMAIN=${PANGOLIN_DOMAIN}

    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro # Volume to store the Traefik configuration
      - ./config/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates
      - ./config/traefik/logs:/var/log/traefik # Volume to store Traefik logs

  crowdsec:
    # Pinned for the same reason as traefik. v1.8.1-debian has the same digest
    # as the latest-debian image that was running when this pin was set.
    image: crowdsecurity/crowdsec:v1.8.1-debian
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
    volumes:
      - ./config/crowdsec:/etc/crowdsec
      - ./config/crowdsec/db:/var/lib/crowdsec/data
      - ./config/traefik/logs:/var/log/traefik:ro

networks:
  default:
    driver: bridge
    name: pangolin
    enable_ipv6: true
